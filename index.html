<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apna Note · Mainul Islam</title>
<meta name="theme-color" content="#0f6b75">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f6;--s:#fff;--ink:#14232e;--mut:#5d6f7c;--line:#d6e0e6;--brand:#0f6b75;--bi:#fff;--c1:#d8f0ea;--c2:#fde9c9;--c3:#e3e6fb;--c4:#fbdde4;--red:#b3261e}
:root[data-theme=dark]{--bg:#0e171d;--s:#16232c;--ink:#e8f0f4;--mut:#94a8b4;--line:#273945;--brand:#4fc3cf;--bi:#06242a;--c1:#1b3a37;--c2:#3d3220;--c3:#262a4a;--c4:#4a2432;--red:#f2b8b5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri",system-ui,sans-serif;font-size:17px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
h1{font-size:1.7rem;margin:0;line-height:1.2}
h1 small{display:block;font-size:.9rem;font-weight:400;color:var(--mut)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
.icon{background:var(--s);color:var(--ink);border:1px solid var(--line);width:44px;height:44px;font-size:1.2rem}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--s);color:var(--ink);font:inherit;margin-bottom:14px}
.editor{background:var(--s);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:18px}
.editor input,.editor textarea{width:100%;border:0;background:transparent;color:var(--ink);font:inherit;padding:6px 2px;outline:0}
.editor input{font-weight:600;font-size:1.15rem;border-bottom:1px solid var(--line);margin-bottom:6px}
.editor textarea{min-height:110px;resize:vertical}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px}
.sws{display:flex;gap:8px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw.on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.primary{background:var(--brand);color:var(--bi);padding:10px 20px;font-weight:600}
.ghost{background:transparent;color:var(--mut);padding:10px 12px}
.grid{display:grid;gap:12px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
.note{border-radius:16px;padding:14px 14px 10px;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.note h3{margin:0;font-size:1.1rem;overflow-wrap:anywhere}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.note time{font-size:.8rem;color:var(--mut)}
.acts{display:flex;gap:4px;margin-left:-8px}
.acts button{background:transparent;color:var(--mut);padding:6px 10px}
.acts .del{color:var(--red)}
.pin{font-size:.8rem;color:var(--brand);font-weight:600}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:36px 12px;border:2px dashed var(--line);border-radius:16px}
footer{text-align:center;color:var(--mut);font-size:.85rem;padding:24px 0 8px}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="brand">
<svg width="46" height="46" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="13" fill="var(--brand)"/><path d="M14 10h14l8 8v20a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2V12a2 2 0 0 1 2-2z" fill="#fff"/><path d="M28 10v6a2 2 0 0 0 2 2h6z" fill="#b9dfe3"/><rect x="16" y="23" width="16" height="2.5" rx="1.2" fill="var(--brand)"/><rect x="16" y="29" width="12" height="2.5" rx="1.2" fill="var(--brand)"/><rect x="16" y="35" width="8" height="2.5" rx="1.2" fill="var(--brand)"/></svg>
<h1>Apna Note<small>Mainul Islam</small></h1>
</div>
<button class="icon" id="theme" aria-label="থিম">◐</button>
</header>
<section class="editor">
<input id="title" placeholder="শিরোনাম / Title" maxlength="120">
<textarea id="body" placeholder="এখানে লিখুন… / Write here…"></textarea>
<div class="row">
<div class="sws" id="sw"></div>
<div>
<button class="ghost" id="cancel" hidden>বাতিল</button>
<button class="primary" id="save">নোট সেভ করুন</button>
</div>
</div>
</section>
<input class="search" id="q" type="search" placeholder="নোট খুঁজুন / Search notes">
<main class="grid" id="list"></main>
<footer>Apna Note · Made by Mainul Islam</footer>
</div>
<script>
var KEY="apna-note-v1",notes=[],color=1,editId=null;
function $(id){return document.getElementById(id)}
try{notes=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){notes=[]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(notes))}catch(e){}}
function esc(s){return s.replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function setSw(){var b=$("sw").children;for(var i=0;i<b.length;i++)b[i].className="sw"+(i+1===color?" on":"")}
for(var i=1;i<=4;i++){(function(i){var b=document.createElement("button");b.className="sw";b.style.background="var(--c"+i+")";b.setAttribute("aria-label","রঙ "+i);b.onclick=function(){color=i;setSw()};$("sw").appendChild(b)})(i)}
setSw();
function reset(){editId=null;$("title").value="";$("body").value="";$("cancel").hidden=true;$("save").textContent="নোট সেভ করুন"}
$("save").onclick=function(){
var t=$("title").value.trim(),b=$("body").value.trim();
if(!t&&!b){alert("কিছু লিখুন, তারপর সেভ করুন");return}
if(editId){var n=notes.filter(function(x){return x.id===editId})[0];n.title=t;n.body=b;n.color=color;n.updated=Date.now()}
else notes.unshift({id:""+Date.now(),title:t,body:b,color:color,pinned:false,updated:Date.now()});
persist();reset();render()};
$("cancel").onclick=reset;
$("q").oninput=render;
function render(){
var q=$("q").value.trim().toLowerCase();
var shown=notes.filter(function(n){return(n.title+" "+n.body).toLowerCase().indexOf(q)>-1}).sort(function(a,b){return(b.pinned-a.pinned)||(b.updated-a.updated)});
if(!shown.length){$("list").innerHTML='<div class="empty">'+(q?"কোনো নোট মেলেনি।":"এখনো কোনো নোট নেই। উপরে প্রথম নোটটি লিখুন।")+'</div>';return}
$("list").innerHTML=shown.map(function(n){return'<article class="note" style="background:var(--c'+n.color+')">'+(n.pinned?'<span class="pin">📌 পিন করা</span>':"")+(n.title?"<h3>"+esc(n.title)+"</h3>":"")+(n.body?"<p>"+esc(n.body)+"</p>":"")+"<time>"+new Date(n.updated).toLocaleString("bn-BD")+'</time><div class="acts"><button data-a="pin" data-id="'+n.id+'">'+(n.pinned?"আনপিন":"পিন")+'</button><button data-a="edit" data-id="'+n.id+'">এডিট</button><button class="del" data-a="del" data-id="'+n.id+'">মুছুন</button></div></article>'}).join("")}
$("list").onclick=function(e){
var b=e.target.closest("button");if(!b)return;
var n=notes.filter(function(x){return x.id===b.dataset.id})[0];if(!n)return;
if(b.dataset.a==="pin"){n.pinned=!n.pinned;persist();render()}
if(b.dataset.a==="edit"){editId=n.id;$("title").value=n.title;$("body").value=n.body;color=n.color;setSw();$("cancel").hidden=false;$("save").textContent="আপডেট করুন";window.scrollTo(0,0)}
if(b.dataset.a==="del"&&confirm("এই নোটটি মুছে ফেলবেন?")){notes=notes.filter(function(x){return x!==n});persist();render()}};
var root=document.documentElement;
try{var th=localStorage.getItem("apna-theme");if(th)root.dataset.theme=th}catch(e){}
$("theme").onclick=function(){root.dataset.theme=root.dataset.theme==="dark"?"light":"dark";try{localStorage.setItem("apna-theme",root.dataset.theme)}catch(e){}};
render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
